<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Admin - Cadastro Simples</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .btn-almoxarifado {
      width: auto;
      margin-top: 0;
      padding: 10px 18px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(124, 58, 237, 0.3);
      transition: background 0.2s, transform 0.1s;
    }
    .btn-almoxarifado:hover {
      background: #6d28d9;
      transform: translateY(-1px);
    }
    .btn-almoxarifado:active {
      transform: translateY(0);
    }
  </style>
</head>

<body>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
      <a href="index.html" style="text-decoration:none;
     color:#3498db; 
    font-size:14px; display:inline-block;">← Voltar para o Login</a>

      <button type="button" class="btn-almoxarifado" onclick="window.location.href='almoxarifado.html'">
        📦 Acessar Almoxarifado
      </button>
    </div>

    <h2>👤 Cadastrar Usuário</h2>

    <form id="formUsuario">
      <input type="text" id="usuario" placeholder="Nome 
    de Usuário
     (Login)" required>
      <input type="password" id="senha" placeholder="Senha" required>


      <select id="tipo" required>
        <option value="">Selecione o Setor</option>
        <option value="atendimento">Atendimento</option>
        <option value="triagem">Triagem</option>
        <option value="medico">Médico</option>
        <option value="almoxarifado">Almoxarifado</option>
      </select>

      <button type="submit">Cadastrar Usuário</button>
    </form>

    <hr style="margin: 25px 0; border: none; border-top:
   1px solid #ccc;">

    <h3>📋 Usuários Cadastrados</h3>
    <div id="listaUsuarios"></div>
  </div>

  <script>
    // 1. Cadastrar usuário ao enviar o formulário
    document.getElementById("formUsuario").addEventListener
      ("submit",
        function (e) {
          e.preventDefault();

          const usuario = document.getElementById("usuario").value;
          const senha = document.getElementById("senha").value;
          const tipo = document.getElementById("tipo").value;

          fetch("/usuarios", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ usuario, senha, tipo })
          })
            .then(res => res.json())
            .then(dados => {
              if (dados.erro) {
                alert("Erro: " + dados.erro);
              } else {
                alert("Usuário cadastrado com sucesso!");
                document.getElementById("formUsuario").reset();
                carregarUsuarios();
              }
            });
        });

    // 2. Carregar e listar os usuários cadastrados
    function carregarUsuarios() {
      fetch("/usuarios")
        .then(res => res.json())
        .then(usuarios => {
          const div = document.getElementById
            ("listaUsuarios");
          div.innerHTML = "";


          usuarios.forEach(u => {
            div.innerHTML += `
            <div class="card">
              <b>Usuário:</b> ${u.usuario} |
               <b>Setor:</b> ${u.tipo}
            </div>
          `;
          });
        });
    }

    // Carrega a lista automaticamente ao abrir a página
    carregarUsuarios();
  </script>

</body>

</html>
