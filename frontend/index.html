
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital Éter - Login</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =====================================
           HOSPITAL ÉTER - IDENTIDADE VISUAL
        ===================================== */

        :root {
            --azul-petroleo: #81AEB6;
            --azul-claro: #88D1FD;
            --vermelho: #BB4342;
            --verde-gelo: #E0FCFB;
            --cinza: #474747;
            --branco: #FFFFFF;
        }

        /* CONFIGURAÇÃO GERAL */
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;

            font-family: 'Segoe UI', Arial, sans-serif;
            color: var(--cinza);

            background:
                radial-gradient(circle at 15% 20%, rgba(136, 209, 253, 0.45), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(129, 174, 182, 0.35), transparent 35%),
                linear-gradient(135deg, #E0FCFB 0%, #F5FBFC 50%, #EAF7FA 100%);
        }

        /* CARTÃO DE LOGIN */
        .login-card {
            position: relative;
            width: 100%;
            max-width: 430px;

            padding: 42px 36px;
            background: var(--branco);

            border: 1px solid rgba(129, 174, 182, 0.25);
            border-radius: 22px;

            box-shadow:
                0 25px 60px rgba(71, 71, 71, 0.10),
                0 8px 20px rgba(129, 174, 182, 0.12);

            animation: aparecer 0.7s ease;
        }

        /* DETALHE SUPERIOR */
        .login-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 12%;
            width: 76%;
            height: 5px;

            background: linear-gradient(
                90deg,
                var(--azul-petroleo),
                var(--azul-claro),
                var(--vermelho)
            );

            border-radius: 0 0 10px 10px;
        }

        /* CABEÇALHO */
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header div {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 78px;
            height: 78px;
            margin: 0 auto 18px;

            font-size: 40px !important;

            background: var(--verde-gelo);
            border-radius: 22px;

            box-shadow: 0 5px 15px rgba(129, 174, 182, 0.15);
        }

        .login-header h2 {
            margin: 0 0 9px;

            color: var(--cinza);
            font-size: 28px;
            font-weight: 750;
            letter-spacing: -0.8px;
        }

        .login-header p {
            margin: 0;

            color: #858585;
            font-size: 14px;
            letter-spacing: 0.2px;
        }

        /* CAMPOS DO FORMULÁRIO */
        .form-group {
            margin-bottom: 21px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;

            color: var(--cinza);
            font-size: 13px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;
            padding: 15px 16px;

            background: #F8FCFC;
            border: 1.5px solid #DCEBEC;
            border-radius: 11px;

            color: var(--cinza);
            font-family: inherit;
            font-size: 14px;

            transition: all 0.25s ease;
        }

        .form-group input::placeholder {
            color: #A6B3B5;
        }

        .form-group input:hover {
            border-color: var(--azul-petroleo);
        }

        .form-group input:focus {
            outline: none;

            background: var(--branco);
            border-color: var(--azul-petroleo);

            box-shadow: 0 0 0 4px rgba(129, 174, 182, 0.17);
        }

        /* BOTÃO ENTRAR */
        .btn-submit {
            width: 100%;
            padding: 15px;
            margin-top: 8px;

            background: linear-gradient(
                135deg,
                #81AEB6,
                #659AA4
            );

            color: var(--branco);
            border: none;
            border-radius: 11px;

            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.4px;

            cursor: pointer;

            box-shadow: 0 7px 18px rgba(129, 174, 182, 0.28);

            transition: all 0.25s ease;
        }

        .btn-submit:hover {
            background: linear-gradient(
                135deg,
                #659AA4,
                #527F89
            );

            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(129, 174, 182, 0.35);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* MENSAGEM DE ERRO */
        .error-msg {
            display: none;

            padding: 13px;
            margin-bottom: 20px;

            background: #FFF0EF;
            border: 1px solid rgba(187, 67, 66, 0.25);
            border-left: 4px solid var(--vermelho);
            border-radius: 9px;

            color: var(--vermelho);
            font-size: 13px;
            font-weight: 600;
            text-align: center;
        }

        /* LINKS DE ACESSO */
        .quick-links {
            margin-top: 30px;
            padding-top: 22px;

            border-top: 1px solid #E9F0F0;

            text-align: center;
            font-size: 13px;
        }

        .quick-links span {
            color: #999 !important;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .quick-links a {
            display: inline-block;
            margin: 5px 5px 0;

            color: #659AA4;
            font-weight: 700;
            text-decoration: none;

            transition: all 0.2s ease;
        }

        .quick-links a:hover {
            color: var(--vermelho);
            text-decoration: none;
        }

        /* ANIMAÇÃO */
        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* RESPONSIVIDADE */
        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .login-card {
                padding: 35px 24px;
                border-radius: 18px;
            }

            .login-header h2 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="login-header">
            <div style="font-size: 40px;">🏥</div>

            <h2>Hospital Éter</h2>

            <p>Acesse com suas credenciais do setor</p>
        </div>

        <div id="msgErro" class="error-msg"></div>

        <form onsubmit="login(event)">

            <div class="form-group">
                <label for="usuario">Usuário / Login</label>

                <input
                    id="usuario"
                    placeholder="Ex: admin, medico, triagem..."
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>

                <input
                    id="senha"
                    type="password"
                    placeholder="Sua senha de acesso"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn-submit"
                id="btnEntrar"
            >
                Entrar no Sistema
            </button>

        </form>

        <div class="quick-links">

            <span style="color:#94a3b8; display:block; margin-bottom: 6px;">
                Acesso Rápido de Gestão:
            </span>

            <a href="admin.html">Painel Admin</a> •
            <a href="tv.html" target="_blank">Painel TV</a>

        </div>

    </div>

    <script>
        function login(e) {
            if (e) e.preventDefault();

            const erroDiv = document.getElementById("msgErro");
            const btn = document.getElementById("btnEntrar");

            erroDiv.style.display = "none";

            btn.disabled = true;
            btn.innerText = "Verificando...";

            fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    usuario: document.getElementById("usuario").value.trim(),
                    senha: document.getElementById("senha").value
                })
            })

            .then(async r => {
                const data = await r.json();

                if (!r.ok || data.erro) {
                    throw new Error(data.erro || "Credenciais inválidas");
                }

                return data;
            })

            .then(data => {

                // Salva sessão local para identificação
                localStorage.setItem("hospital_user", JSON.stringify(data));

                const rotas = {
                    admin: "admin.html",
                    atendimento: "atendimento.html",
                    triagem: "triagem.html",
                    medico: "medico.html",
                    medicacoes: "medicacoes.html",
                    almoxarifado: "almoxarifado.html",
                    tv: "tv.html"
                };

                if (rotas[data.tipo]) {
                    location.href = rotas[data.tipo];
                } else {
                    location.href = data.tipo + ".html";
                }

            })

            .catch(err => {
                erroDiv.innerText = err.message || "Usuário ou senha inválidos!";
                erroDiv.style.display = "block";
            })

            .finally(() => {
                btn.disabled = false;
                btn.innerText = "Entrar no Sistema";
            });
        }

        // Atalho secreto: Ctrl + Alt + A redireciona para admin2.html
        window.addEventListener("keydown", function(e) {
            if (e.ctrlKey && e.altKey && (e.key === "a" || e.key === "A")) {
                e.preventDefault();
                window.location.href = "admin2.html";
            }
        });
    </script>

</body>
</html>
