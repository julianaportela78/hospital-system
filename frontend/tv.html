
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hospital Éter - Painel de Chamadas</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    :root {
      --primary: #81AEB6;
      --secondary: #88D1FD;
      --soft: #E0FCFB;
      --dark: #474747;
      --background: #F2F5F5;
      --white: #FFFFFF;
      --border: #E6ECEC;
      --red: #BB4342;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: var(--background);
      overflow: hidden;
      padding: 16px;
    }

    /* ESTRUTURA PRINCIPAL */

    .tv-container {
      display: flex;
      width: 100%;
      height: calc(100vh - 32px);
      gap: 16px;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      width: 32%;
      min-width: 0;
      gap: 16px;
    }

    .right-panel {
      display: flex;
      flex-direction: column;
      width: 68%;
      min-width: 0;
      gap: 16px;
    }

    /* PAINÉIS GERAIS */

    .box {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 4px 15px rgba(35, 65, 70, 0.06);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .box-title {
      color: var(--dark);
      font-size: clamp(16px, 1.6vw, 25px);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.2;
      margin-bottom: 15px;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    /* LOCAL DE ATENDIMENTO */

    .local-box {
      flex: 1;
      background: linear-gradient(145deg, #FFFFFF, #EAF6F6);
      border-top: 6px solid var(--primary);
    }

    .local-icon {
      font-size: clamp(25px, 3vw, 42px);
      margin-bottom: 8px;
    }

    .local-box .box-title {
      margin-bottom: 10px;
    }

    .local-number {
      color: var(--primary);
      font-size: clamp(65px, 8vw, 125px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -3px;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .local-type {
      color: var(--dark);
      font-size: clamp(15px, 1.6vw, 23px);
      font-weight: 800;
      margin-top: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .local-caption {
      color: #829092;
      font-size: clamp(11px, 1vw, 15px);
      margin-top: 8px;
    }

    /* HISTÓRICO */

    .history-box {
      flex: 1;
      justify-content: flex-start;
      align-items: stretch;
      padding: 18px;
    }

    .history-box .box-title {
      font-size: clamp(14px, 1.4vw, 21px);
      text-align: center;
      margin-bottom: 16px;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .history-header span {
      font-size: 19px;
    }

    #history-list {
      list-style: none;
      width: 100%;
      color: var(--dark);
      font-size: clamp(12px, 1.15vw, 17px);
      font-weight: 700;
      text-align: left;
      line-height: 1.35;
    }

    #history-list li {
      padding: 10px;
      margin-bottom: 8px;
      background: #F5F9F9;
      border-radius: 9px;
      border-left: 4px solid var(--primary);
      overflow-wrap: anywhere;
    }

    #history-list .history-empty {
      color: #929D9F;
      text-align: center;
      font-weight: 400;
      border: none;
      background: transparent;
      padding: 15px 5px;
    }

    /* PACIENTE CHAMADO */

    .patient-box {
      flex: 3;
      position: relative;
      background: linear-gradient(145deg, #FFFFFF 55%, #E9F7F7);
      border-top: 6px solid var(--primary);
    }

    .patient-label {
      color: var(--primary);
      font-size: clamp(15px, 1.7vw, 25px);
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 18px;
    }

    .patient-box .box-title {
      margin-bottom: 20px;
    }

    .patient-name {
      color: var(--dark);
      font-size: clamp(34px, 5vw, 76px);
      font-weight: 900;
      line-height: 1.15;
      text-transform: uppercase;
      overflow-wrap: anywhere;
      word-break: normal;
      max-width: 100%;
    }

    .patient-decoration {
      width: 75px;
      height: 5px;
      background: var(--secondary);
      border-radius: 10px;
      margin-top: 22px;
      flex-shrink: 0;
    }

    .waiting-message {
      color: #849193;
      font-size: clamp(13px, 1.3vw, 19px);
      font-weight: 600;
      margin-top: 16px;
      line-height: 1.4;
      max-width: 90%;
    }

    .call-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: #829092;
      font-size: clamp(10px, 0.95vw, 14px);
      font-weight: 600;
      margin-top: 20px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #65B99A;
      box-shadow: 0 0 0 4px rgba(101, 185, 154, 0.13);
    }

    /* LOGO */

    .logo-box {
      flex: 0.8;
      flex-direction: row;
      justify-content: center;
      gap: 18px;
      background: var(--dark);
      color: var(--white);
      padding: 15px;
    }

    .logo-icon {
      font-size: clamp(30px, 3.5vw, 48px);
      flex-shrink: 0;
    }

    .logo-content {
      text-align: left;
      min-width: 0;
    }

    .logo-text {
      color: var(--white);
      font-size: clamp(21px, 2.5vw, 36px);
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .logo-subtitle {
      color: #BFD5D7;
      font-size: clamp(9px, 0.95vw, 14px);
      letter-spacing: 2px;
      margin-top: 6px;
    }

    /* ANIMAÇÃO DE NOVA CHAMADA */

    @keyframes flash {
      0%, 100% {
        background: linear-gradient(145deg, #FFFFFF 55%, #E9F7F7);
      }

      50% {
        background: #D8F5F3;
      }
    }

    .flash {
      animation: flash 0.5s ease 3;
    }

    /* TELAS MENORES */

    @media (max-width: 900px) {
      body {
        padding: 10px;
      }

      .tv-container {
        height: calc(100vh - 20px);
        gap: 10px;
      }

      .left-panel,
      .right-panel {
        gap: 10px;
      }

      .box {
        padding: 14px;
        border-radius: 14px;
      }

      .history-box {
        padding: 12px;
      }

      #history-list li {
        padding: 8px;
      }
    }

    @media (max-width: 600px) {
      body {
        overflow: auto;
      }

      .tv-container {
        height: auto;
        min-height: calc(100vh - 20px);
        flex-direction: column;
      }

      .left-panel,
      .right-panel {
        width: 100%;
      }

      .left-panel {
        flex-direction: row;
        height: 230px;
      }

      .right-panel {
        height: 470px;
      }

      .local-number {
        font-size: clamp(50px, 13vw, 75px);
      }

      .patient-name {
        font-size: clamp(30px, 8vw, 48px);
      }

      .history-box .box-title {
        font-size: 12px;
      }

      #history-list {
        font-size: 11px;
      }

      #history-list li {
        padding: 6px;
        margin-bottom: 5px;
      }

      .logo-box {
        min-height: 95px;
      }
    }
  </style>
</head>

<body>

  <div class="tv-container">

    <!-- PAINEL ESQUERDO -->
    <div class="left-panel">

      <!-- LOCAL DA CHAMADA -->
      <div class="box local-box">

        <div class="local-icon">📍</div>

        <div class="box-title" id="local-tipo">
          GUICHÊ
        </div>

        <div class="local-number" id="local-numero">
          --
        </div>

        <div class="local-type">
          LOCAL DE ATENDIMENTO
        </div>

        <div class="local-caption">
          Dirija-se ao local indicado
        </div>

      </div>

      <!-- HISTÓRICO -->
      <div class="box history-box">

        <div class="box-title">
          <div class="history-header">
            <span>🕒</span>
            ÚLTIMAS CHAMADAS
          </div>
        </div>

        <ul id="history-list">
          <li class="history-empty">
            Nenhuma chamada realizada.
          </li>
        </ul>

      </div>

    </div>

    <!-- PAINEL DIREITO -->
    <div class="right-panel">

      <!-- PACIENTE CHAMADO -->
      <div class="box patient-box">

        <div class="patient-label">
          ATENÇÃO
        </div>

        <div class="box-title">
          PACIENTE CHAMADO
        </div>

        <div class="patient-name" id="patient-name">
          AGUARDANDO...
        </div>

        <div class="patient-decoration"></div>

        <div class="waiting-message">
          Aguarde sua chamada ou dirija-se ao local indicado.
        </div>

        <div class="call-indicator">
          <span class="status-dot"></span>
          Painel de chamadas em funcionamento
        </div>

      </div>

      <!-- IDENTIDADE DO HOSPITAL -->
      <div class="box logo-box">

        <div class="logo-icon">🏥</div>

        <div class="logo-content">

          <div class="logo-text">
            Hospital Éter
          </div>

          <div class="logo-subtitle">
            CUIDAR É NOSSA ESSÊNCIA
          </div>

        </div>

      </div>

    </div>

  </div>

  <script>
    let ultimoId = null;

    // Busca a chamada atual e o histórico.
    function atualizar() {
      fetch("/tv/chamada")
        .then(r => {
          if (!r.ok) {
            throw new Error("Erro ao consultar chamadas.");
          }

          return r.json();
        })
        .then(data => {
          const chamada = data.chamada;
          const historico = data.historico || [];

          if (chamada) {
            document.getElementById("local-tipo").innerText =
              chamada.localTipo || "GUICHÊ";

            document.getElementById("local-numero").innerText =
              chamada.localNumero || "--";

            document.getElementById("patient-name").innerText =
              chamada.paciente || "AGUARDANDO...";

            // Animação quando uma nova chamada acontece.
            if (chamada.id !== ultimoId) {
              ultimoId = chamada.id;

              const patientBox =
                document.querySelector(".patient-box");

              patientBox.classList.remove("flash");

              void patientBox.offsetWidth;

              patientBox.classList.add("flash");
            }
          }

          // Atualiza o histórico.
          const list = document.getElementById("history-list");

          list.innerHTML = "";

          if (historico.length === 0) {
            const li = document.createElement("li");

            li.className = "history-empty";
            li.innerText = "Nenhuma chamada realizada.";

            list.appendChild(li);

            return;
          }

          historico.slice(0, 4).forEach(h => {
            const li = document.createElement("li");

            const tipo = h.localTipo
              ? h.localTipo.substring(0, 4)
              : "GUIC";

            li.innerText =
              `${tipo}. ${h.localNumero} - ${h.paciente}`;

            list.appendChild(li);
          });
        })
        .catch(err => {
          console.log("Erro ao buscar chamada:", err);
        });
    }

    // Primeira atualização.
    atualizar();

    // Consulta novas chamadas a cada 2 segundos.
    setInterval(atualizar, 2000);
  </script>

</body>
</html>
